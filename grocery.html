<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grocery List</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="global.css" rel="stylesheet">
    <link href="grocery.css" rel="stylesheet">

    <script src="grocery.js" defer></script>
</head>
<body>
    <div class="container py-4">
        <header class="grocery-header text-center mb-4">
            <h1>Grocery List</h1>
            <p>Ingredients compiled from your favorited recipes.</p>
        </header>

        <section class="grocery-box">
            <div class="grocery-actions mb-3">
                <button id="clear-checks-button" class="grocery-button">Clear Checked</button>
            </div>

            <ul id="grocery-list" class="grocery-list"></ul>

            <p id="empty-message" class="empty-message hidden">
                No grocery items yet. Add some recipes to favorites first.
            </p>
        </section>
    </div>
</body>
</html>
