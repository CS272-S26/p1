<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Recipe Finder</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="global.css" rel="stylesheet" />
    <link href="index.css" rel="stylesheet" />

    <script src="index.js" defer></script>
</head>
<body>
    <main class="homepage-wrapper">
        <div class="homepage-overlay">
            <div class="container py-4 py-md-5">

                <header class="hero-section text-center">
                    <h1 class="homepage-title">Food Recipe Finder and Meal Planner</h1>
                    <p class="homepage-subtitle">
                        Discover recipes, explore featured dishes, and check out our team favorites.
                    </p>

                    <div class="hero-buttons">
                        <a href="planner.html" class="hero-btn">Meal Planner</a>
                        <a href="favorites.html" class="hero-btn">Favorites</a>
                    </div>
                </header>

                <section class="homepage-section">
                    <div class="section-header">
                        <h2 class="section-title">Trending / Featured Recipes</h2>
                        <p class="section-text">A few recipes we picked to feature on the homepage.</p>
                    </div>

                    <div id="featured-grid" class="recipe-grid"></div>
                </section>

                <section class="homepage-section">
                    <div class="section-header">
                        <h2 class="section-title">Our Favorite Recipes</h2>
                        <p class="section-text">Each group member's current favorite pick.</p>
                    </div>

                    <div id="favorites-grid" class="recipe-grid"></div>
                </section>

            </div>
        </div>
    </main>
</body>
</html>
