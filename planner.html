<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Meal Planner</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link href="global.css" rel="stylesheet"/>
        <link href="planner.css" rel="stylesheet"/>
        <script src="planner.js" defer></script>
        <script src="favorites.js" defer></script>
    </head>
    <body>
        <div>
            <header class = "header-planner">
                <h1>Meal Planner</h1>
                <p>Easily map out your recipes for every kind of meal: breakfast, lunch, dinner, dessert, snacks, and drinks!</p>
            </header>
        </div>

        <div class="container py-4 px-5">
            <div class = "row gx-4 gy-4">
                <div class = "col-12 col-md-6 col-xl-4">
                    <div class = "meal-type" id = "breakfast">
                        <h2>Breakfast</h2>
                        <button class="add-button">Add Recipe</button>
                        <div class = "meal-recipes"></div>
                    </div>
                </div>

                <div class = "col-12 col-md-6 col-xl-4">
                    <div class = "meal-type" id = "lunch">
                        <h2>Lunch</h2>
                        <button class="add-button">Add Recipe</button>
                        <div class = "meal-recipes"></div>
                    </div>
                </div>

                <div class = "col-12 col-md-6 col-xl-4">
                    <div class = "meal-type" id = "dinner">
                        <h2>Dinner</h2>
                        <button class="add-button">Add Recipe</button>
                        <div class = "meal-recipes"></div>
                    </div>
                </div>
                
                <div class = "col-12 col-md-6 col-xl-4">
                    <div class = "meal-type" id = "dessert">
                        <h2>Dessert</h2>
                        <button class="add-button">Add Recipe</button>
                        <div class = "meal-recipes"></div>
                    </div>
                </div>
                
                <div class = "col-12 col-md-6 col-xl-4">
                    <div class = "meal-type" id = "snack">
                        <h2>Snacks</h2>
                        <button class="add-button">Add Recipe</button>
                        <div class = "meal-recipes"></div>
                    </div>
                </div>

                <div class = "col-12 col-md-6 col-xl-4">
                    <div class = "meal-type" id = "drink">
                        <h2>Drinks</h2>
                        <button class="add-button">Add Recipe</button>
                        <div class = "meal-recipes"></div>
                    </div>
                </div>
                
            </div>
        </div>
        
        <div class = "popup-planner hidden" id = "recipe-popup">
            <div class="popup-content">
                <div class="popup-header">
                    <h3 class="popup-title">Add Recipe</h3>
                    <button type="button" id="close-button">x</button>
                </div>

                <div class="popup-body">
                    <h4>Choose from your favorited recipes here:</h4>
                    <div id = "popup-recipes"></div>
                </div>
            </div>
        </div>

    </body>
</html>
